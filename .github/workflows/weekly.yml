name: Weekly grant radar

on:
  schedule:
    # Mondays 11:00 UTC = Mondays 06:00 America/Chicago (CT) during CDT (-05:00).
    # Keep this at 11:00 UTC year-round — during CST (-06:00) it fires at 05:00 CT, close enough.
    - cron: "0 11 * * 1"
  workflow_dispatch:   # manual trigger — use this for the first run
  push:
    branches: [main]
    paths:
      - "sources.yaml"
      - "profile.yaml"
      - "scorer/**"
      - "scrapers/**"
      - "pipeline.py"

permissions:
  contents: write      # commit the updated opportunities.json
  pages: write
  id-token: write

concurrency:
  group: grant-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run radar pipeline
        run: python pipeline.py
        env:
          GRANT_RADAR_LLM_PROVIDER: ""

      - name: Commit updated data
        run: |
          git config user.name "grant-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/opportunities.json site/data/opportunities.json site/data/digest.json drafts/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "radar: weekly update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Send digest email (Gmail SMTP, plain text)
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          GRANT_RADAR_SITE_URL: ${{ vars.SITE_URL }}
        run: python send_digest.py

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: radar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
